<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marfa Labs</title>
<meta name="description" content="Marfa Labs builds a writing agent that doesn't sound like AI.">
<meta property="og:title" content="Marfa Labs">
<meta property="og:description" content="Writing that doesn't sound like a machine.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23140604'/><path d='M8 23 L16 9 L24 23' fill='none' stroke='%23e8823a' stroke-width='2.6' stroke-linejoin='round'/></svg>">
<script>
  // Apply the saved or system theme before paint, so there's no flash.
  (() => {
    let t = null;
    try { t = localStorage.getItem("marfa-theme"); } catch {}
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="motes" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="nav">
  <a class="wordmark" href="/" aria-label="Marfa Labs">M<span class="a"></span>RF<span class="a"></span> L<span class="a"></span>BS</a>
  <button class="theme" id="theme" type="button" aria-label="Switch to light mode">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
  </button>
</header>

<main class="stage">
  <div class="bloom" aria-hidden="true">
    <div class="halo"></div>
    <svg id="flower" viewBox="-260 -260 520 520"></svg>
  </div>

  <div class="copy">
    <h1>Writing that doesn't<br>sound like a machine.</h1>
    <p class="sub">A writing agent with range. Private beta, 2027.</p>
    <form class="join" id="join">
      <input type="email" name="email" required placeholder="Email" aria-label="Email">
      <button type="submit">Join</button>
    </form>
    <p class="note" id="note"></p>
  </div>
</main>

<footer class="foot">
  <span>© 2026 Marfa Labs</span>
  <a href="https://substack.com/@juliahq" target="_blank" rel="noopener">Research ↗</a>
</footer>

<script src="flower.js"></script>
<script src="app.js"></script>
</body>
</html>
