<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-22 -22 44 44'><defs><clipPath id='c'><rect x='-22' y='-22' width='44' height='44' rx='9.68'/></clipPath></defs><rect x='-22' y='-22' width='44' height='44' rx='9.68' fill='%23000000'/><g clip-path='url(%23c)'><path d='M-50 0 Q-12 -1 0 -1.5 Q12 -1 50 0 Q12 1 0 1.5 Q-12 1 -50 0Z' fill='%23f8f4ec'/><path d='M10.96 -10.96 Q3.29 -4.99 0 -3.4 Q-3.03 -4.73 -10.11 -10.11 Q-4.73 -3.03 -3.4 0 Q-4.92 3.22 -10.75 10.75 Q-3.22 4.92 0 3.4 Q2.97 4.67 9.9 9.9 Q4.67 2.97 3.4 0 Q4.99 -3.29 10.96 -10.96Z' fill='%23f8f4ec'/></g></svg>">
<script>
  // Apply the saved theme (light by default) before paint, so there's no flash.
  (() => {
    let t = null;
    try { t = localStorage.getItem("marfa-theme"); } catch {}
    if (t !== "dark") t = "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.add("js"); // lets "A place to think" start hidden, then type in
  })();
</script>
<link rel="preload" as="image" href="img/marfa-day.jpg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=57">
</head>
<body>

<div class="photo day" aria-hidden="true"></div>
<div class="photo night" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>

<header class="nav">
  <nav class="left">
    <a>Research</a>
    <div class="menu">
      <a href="#email" aria-haspopup="true">Solutions</a>
      <div class="dropdown">
        <a href="#email">Sales</a>
        <a href="#email">Marketing</a>
        <a href="#email">Film and TV development</a>
        <a href="#email">Creative writing</a>
      </div>
    </div>
  </nav>
  <a class="brand" href="/" aria-label="Marfa Labs home">
    <svg viewBox="-51 -13 102 26" aria-hidden="true"><path d="M-50 0 Q-12 -1 0 -1.5 Q12 -1 50 0 Q12 1 0 1.5 Q-12 1 -50 0Z"/><path d="M10.96 -10.96 Q3.29 -4.99 0 -3.4 Q-3.03 -4.73 -10.11 -10.11 Q-4.73 -3.03 -3.4 0 Q-4.92 3.22 -10.75 10.75 Q-3.22 4.92 0 3.4 Q2.97 4.67 9.9 9.9 Q4.67 2.97 3.4 0 Q4.99 -3.29 10.96 -10.96Z"/></svg>
  </a>
  <div class="right">
    <button class="theme" id="theme" type="button" aria-label="Switch to dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
    </button>
  </div>
</header>

<main class="hero">
  <h1 class="giant" aria-label="Marfa Labs"><span>MARFA</span></h1>
  <div class="below">
    <p class="kicker">A place to think<span class="blink">.</span></p>
    <p class="sub">Writing agents with range. Private beta, 2027.</p>
    <form class="join" id="join">
      <input id="email" type="email" name="email" required placeholder="Your email" aria-label="Email">
      <button type="submit">Join</button>
    </form>
    <p class="note" id="note" aria-live="polite"></p>
  </div>
</main>

<footer class="foot">
  <span>© 2026 Marfa Labs</span>
  <span class="credit day">Photo: Charlie Fair / Unsplash</span>
  <span class="credit night">Photo: Alex Moliski / Unsplash</span>
</footer>

<script src="app.js?v=46"></script>

</html>
